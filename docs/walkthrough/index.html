<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coliving Unlocked — Pre-Launch Walkthrough</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal-bg:#E1F5EE;--teal-text:#0F6E56;--teal-border:#5DCAA5;
  --amber-bg:#FAEEDA;--amber-text:#854F0B;--amber-border:#EF9F27;
  --blue-bg:#E6F1FB;--blue-text:#185FA5;--blue-border:#378ADD;
  --purple-bg:#EEEDFE;--purple-text:#3C3489;--purple-border:#7F77DD;
  --coral-bg:#FAECE7;--coral-text:#993C1D;--coral-border:#D85A30;
  --gray-bg:#F1EFE8;--gray-text:#444441;--gray-border:#888780;
  --green-bg:#EAF3DE;--green-text:#3B6D11;--green-border:#639922;
  --accent:#378ADD;--success:#1D9E75;
  --cu-dark:#0B2419;--cu-gold:#C9A84C;--cu-black:#000;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh}
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
#splash h1{font-size:1.75rem;font-weight:600;margin-bottom:.5rem}
#splash p{color:#666;margin-bottom:2rem;line-height:1.6;max-width:420px}
.field-group{text-align:left;width:100%;max-width:380px;margin-bottom:1rem}
.field-group label{display:block;font-size:.85rem;color:#555;margin-bottom:.35rem;font-weight:500}
.field-group input{width:100%;padding:.6rem .75rem;border:1px solid #ddd;border-radius:8px;font-size:1.1rem;background:#fff}
.field-group input:focus{outline:none;border-color:var(--accent)}
#startBtn{background:var(--accent);color:#fff;border:none;padding:.7rem 2rem;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;max-width:380px}
#startBtn:hover{background:#2a7ac8}
#app{display:none;max-width:680px;margin:0 auto;padding:1rem}
.progress-bar-wrap{background:#fff;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.progress-property{font-weight:600;font-size:.95rem}
.progress-count{font-size:.8rem;color:#777}
.progress-track{background:#eee;border-radius:999px;height:7px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;transition:width .3s ease;background:var(--accent)}
.progress-fill.done{background:var(--success)}
.progress-label{text-align:right;font-size:.75rem;color:#999;margin-top:.3rem}
.progress-label.done{color:var(--success);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:1rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;flex-shrink:0;min-width:68px;position:relative;transition:border .15s,background .15s}
.tab.active{border-width:2px}
.tab-icon{font-size:18px}
.tab-label{font-size:10px;white-space:nowrap}
.tab-prog{width:32px;height:2px;background:#eee;border-radius:999px;overflow:hidden}
.tab-prog-fill{height:100%;border-radius:999px}
.tab-done-badge{position:absolute;top:-6px;right:-6px;background:var(--success);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem}
.section-icon-wrap{border-radius:8px;padding:7px 9px;display:flex;align-items:center;font-size:20px}
.section-title{font-size:1rem;font-weight:600;margin:0}
.section-subtitle{font-size:.8rem;color:#777;margin-top:1px}
.unit-picker{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:.6rem 1rem;margin-bottom:.75rem}
.unit-picker-label{font-size:.85rem;color:#666;flex:1}
.unit-btns{display:flex;gap:4px}
.unit-btn{width:28px;height:28px;border-radius:6px;border:1px solid #ddd;background:#f8f8f8;font-size:.75rem;cursor:pointer;font-weight:500;transition:all .1s}
.unit-btn.active{border-width:2px;font-weight:600}
.unit-heading{font-size:.8rem;font-weight:600;text-transform:capitalize;padding:.4rem 0;border-bottom:1px solid;margin-bottom:.5rem;margin-top:.75rem}
.item{border:1px solid #e8e8e8;border-radius:8px;background:#fff;overflow:hidden;margin-bottom:3px;transition:background .15s}
.item.checked{background:#f4fcf9;border-color:#b2e8d4}
.item-main{display:flex;align-items:flex-start;gap:10px;padding:10px 12px}
.check{width:22px;height:22px;border-radius:5px;border:1.5px solid #ccc;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:1px;transition:all .1s}
.check.checked{background:var(--success);border-color:var(--success)}
.check svg{width:12px;height:12px;stroke:#fff;stroke-width:2.5;fill:none;display:none}
.check.checked svg{display:block}
.item-text{flex:1;font-size:.88rem;line-height:1.5;padding-top:2px}
.item.checked .item-text{text-decoration:line-through;color:#999}
.item-actions{display:flex;gap:4px;flex-shrink:0}
.action-btn{width:30px;height:30px;border-radius:6px;border:1px solid #e0e0e0;background:#f8f8f8;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.action-btn:hover{background:#f0f0f0}
.action-btn svg{width:15px;height:15px;stroke:#888;stroke-width:1.5;fill:none}
.action-btn.has-content{border-color:var(--accent);background:#EBF4FD}
.action-btn.has-content svg{stroke:var(--accent)}
.action-btn.has-photo svg{stroke:var(--success)}
.action-btn.has-photo{border-color:var(--success);background:#f0faf6}
.note-area{padding:0 12px 10px 44px}
.note-area input{width:100%;padding:.4rem .6rem;border:1px solid #e0e0e0;border-radius:6px;font-size:.82rem;background:#fafafa}
.note-area input:focus{outline:none;border-color:var(--accent)}
.photo-strip{padding:0 12px 10px 44px;display:flex;gap:6px;flex-wrap:wrap}
.photo-thumb{width:72px;height:72px;border-radius:6px;object-fit:cover;border:1px solid #e0e0e0}
.nav-btns{display:flex;gap:8px;margin-top:1.25rem;padding-top:1rem;border-top:1px solid #eee}
.nav-btn{flex:1;padding:.65rem 0;border-radius:8px;font-size:.9rem;cursor:pointer;font-weight:500;border:1px solid #ddd;background:#fff;transition:all .1s}
.nav-btn:hover{background:#f5f5f5}
.nav-btn.primary{border-width:2px;font-weight:600}
.nav-btn.go-live{background:var(--success);color:#fff;border:none}
.nav-btn.go-live:hover{background:#188a65}

/* Report modal */
#reportModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;overflow-y:auto;padding:1rem}
#reportModal.open{display:block}
.report-card{background:#fff;border-radius:16px;max-width:720px;margin:0 auto;padding:2rem;position:relative}
.report-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid #eee}
.report-title{font-size:1.4rem;font-weight:700}
.report-meta{font-size:.85rem;color:#666;margin-top:.25rem}
.report-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:#999;padding:0;line-height:1}
.report-section{margin-bottom:1.5rem}
.report-section-title{font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#444;margin-bottom:.6rem;padding:.35rem .6rem;border-radius:6px;background:#f5f5f3}
.report-unit{margin-bottom:.75rem}
.report-unit-label{font-size:.8rem;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem}
.report-item{display:flex;align-items:flex-start;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #f5f5f5;font-size:.85rem}
.report-item:last-child{border-bottom:none}
.ri-check{width:16px;height:16px;border-radius:3px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.ri-check.done{background:var(--success)}
.ri-check.undone{background:#f5f5f3;border:1px solid #ddd}
.ri-check svg{width:9px;height:9px;stroke:#fff;stroke-width:2.5;fill:none}
.ri-text{flex:1;line-height:1.4}
.ri-text.done{color:#444}
.ri-text.undone{color:#aaa}
.ri-note{font-size:.75rem;color:#888;margin-top:.15rem;font-style:italic}
.report-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:.4rem}
.report-photo{width:80px;height:80px;border-radius:6px;object-fit:cover;border:1px solid #e0e0e0}
.report-summary{display:flex;gap:1rem;margin-bottom:1.5rem}
.report-stat{flex:1;background:#f8f8f8;border-radius:10px;padding:.75rem 1rem;text-align:center}
.report-stat-num{font-size:1.6rem;font-weight:700}
.report-stat-num.green{color:var(--success)}
.report-stat-num.amber{color:#BA7517}
.report-stat-label{font-size:.75rem;color:#888;margin-top:.15rem}
.report-footer{margin-top:1.5rem;padding-top:1rem;border-top:1px solid #eee;display:flex;gap:.75rem;flex-wrap:wrap}
.report-action{flex:1;min-width:140px;padding:.65rem 1rem;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-align:center;border:none}
.report-action.print-btn{background:var(--accent);color:#fff}
.report-action.close-btn{background:#f0f0f0;color:#444}

/* Print styles */
@media print{
  body{background:#fff}
  #app,#splash,#reportModal{display:block!important}
  #splash,#app{display:none!important}
  #reportModal{display:block!important;position:static;background:none;padding:0}
  .report-card{box-shadow:none;border-radius:0;padding:1.5rem;max-width:none}
  .report-close,.report-footer,.tabs,.progress-bar-wrap,.nav-btns,.section-header,.unit-picker{display:none!important}
  .report-photo{width:70px;height:70px}
  @page{margin:1.5cm}
}
</style>
</head>

const REPORT_ENDPOINT='https://script.google.com/macros/s/AKfycbyAa3hwF-ARdTFTPD7v31OU0yRSWYZHYXv3lJ1FORq0zmcNJlU6uJw_fIWW_BE2w6O9/exec';

function saveState(){
  try{
    const payload={propName,inspector,startDate,activeSection,checked,notes,photos,unitCounts};
    localStorage.setItem(SAVE_KEY,JSON.stringify(payload));
  }catch(e){
    if(e.name==='QuotaExceededError'){
      showToast('Storage full — try reducing photos per item.','#BA7517');
    }
  }
}

function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const s=JSON.parse(raw);
    propName=s.propName||'';
    inspector=s.inspector||'';
    startDate=s.startDate||'';
    activeSection=s.activeSection||0;
    checked=s.checked||{};
    notes=s.notes||{};
    photos=s.photos||{};
    unitCounts=s.unitCounts||{};
    SECTIONS.forEach(sec=>{
      if(!checked[sec.id])checked[sec.id]={};
      if(!notes[sec.id])notes[sec.id]={};
      if(!photos[sec.id])photos[sec.id]={};
      if(!unitCounts[sec.id])unitCounts[sec.id]=1;
      if(!showNotes[sec.id])showNotes[sec.id]={};
    });
    return true;
  }catch(e){return false;}
}

function clearSave(){localStorage.removeItem(SAVE_KEY);}

function showToast(msg,bg){
  const t=document.createElement('div');
  t.textContent=msg;
  Object.assign(t.style,{position:'fixed',bottom:'1.5rem',left:'50%',transform:'translateX(-50%)',background:bg||'#1a1a18',color:'#fff',padding:'.6rem 1.2rem',borderRadius:'999px',fontSize:'.85rem',fontWeight:'500',zIndex:'999',boxShadow:'0 4px 12px rgba(0,0,0,.15)',whiteSpace:'nowrap'});
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2000);
}

window.addEventListener('load',()=>{
  if(loadState()&&propName&&inspector){
    const prog=totalProg();
    document.getElementById('propName').value=propName;
    document.getElementById('inspectorName').value=inspector;
    const banner=document.getElementById('resumeBanner');
    banner.style.display='flex';
    document.getElementById('resumeText').textContent=propName+' · '+prog.done+'/'+prog.total+' items saved';
  }
});

function resumeWalkthrough(){
  document.getElementById('splash').style.display='none';
  document.getElementById('app').style.display='block';
  render();
}

function startFresh(){
  clearSave();
  SECTIONS.forEach(s=>{checked[s.id]={};notes[s.id]={};photos[s.id]={};unitCounts[s.id]=1;showNotes[s.id]={};});
  propName='';inspector='';activeSection=0;startDate='';
  document.getElementById('propName').value='';
  document.getElementById('inspectorName').value='';
  document.getElementById('resumeBanner').style.display='none';
}

function startWalkthrough(){
  propName=document.getElementById('propName').value.trim();
  inspector=document.getElementById('inspectorName').value.trim();
  if(!propName||!inspector){alert('Please enter a property name and inspector name.');return;}
  startDate=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  clearSave();
  SECTIONS.forEach(s=>{checked[s.id]={};notes[s.id]={};photos[s.id]={};unitCounts[s.id]=1;showNotes[s.id]={};});
  document.getElementById('splash').style.display='none';
  document.getElementById('app').style.display='block';
  render();
}

function totalProg(){
  let total=0,done=0;
  SECTIONS.forEach(s=>{
    const u=s.perUnit?unitCounts[s.id]:1;
    total+=s.items.length*u;
    for(let ui=0;ui<u;ui++){
      const k=s.perUnit?ui:'x';
      s.items.forEach((_,i)=>{if(checked[s.id][k+'-'+i])done++;});
    }
  });
  return{total,done,pct:total?Math.round(done/total*100):0};
}

function secProg(sid){
  const s=SECTIONS.find(x=>x.id===sid);
  const u=s.perUnit?unitCounts[sid]:1;
  let total=s.items.length*u,done=0;
  for(let ui=0;ui<u;ui++){
    const k=s.perUnit?ui:'x';
    s.items.forEach((_,i)=>{if(checked[sid][k+'-'+i])done++;});
  }
  return{total,done,pct:total?Math.round(done/total*100):0,allDone:done===total};
}

function checkSVG(){return`<svg viewBox="0 0 12 9"><polyline points="1,5 4,8 11,1"/></svg>`;}

function render(){
  const prog=totalProg();
  const sec=SECTIONS[activeSection];
  const col=COL[sec.color];
  const sp=secProg(sec.id);
  const numUnits=sec.perUnit?unitCounts[sec.id]:1;

  document.getElementById('progProp').textContent=propName;
  document.getElementById('progCount').textContent=`${prog.done} / ${prog.total} items`;
  const fill=document.getElementById('progFill');
  fill.style.width=prog.pct+'%';
  fill.className='progress-fill'+(prog.pct===100?' done':'');
  const lbl=document.getElementById('progLabel');
  lbl.textContent=prog.pct===100?'✓ Ready to go live':prog.pct+'% complete';
  lbl.className='progress-label'+(prog.pct===100?' done':'');

  // Tabs
  document.getElementById('tabs').innerHTML=SECTIONS.map((s,idx)=>{
    const sp2=secProg(s.id);
    const active=idx===activeSection;
    const c=COL[s.color];
    return`<div class="tab${active?' active':''}" onclick="activeSection=${idx};render()" style="${active?`border-color:${c.border};background:${c.bg};color:${c.text};`:''}">
      ${sp2.allDone?'<div class="tab-done-badge">✓</div>':''}
      <div class="tab-icon">${s.icon}</div>
      <div class="tab-label" style="color:${active?c.text:'#888'};font-weight:${active?600:400}">${s.label}</div>
      ${sp2.pct>0&&!sp2.allDone?`<div class="tab-prog"><div class="tab-prog-fill" style="width:${sp2.pct}%;background:${c.border}"></div></div>`:''}
    </div>`;
  }).join('');

  // Section content
  let html=`<div class="section-header">
    <div class="section-icon-wrap" style="background:${col.bg}">${sec.icon}</div>
    <div>
      <div class="section-title" style="color:${col.text}">${sec.label}</div>
      <div class="section-subtitle">${sp.pct}% complete · ${sp.done}/${sp.total} items</div>
    </div>
  </div>`;

  if(sec.perUnit){
    html+=`<div class="unit-picker">
      <span class="unit-picker-label">How many ${sec.unitLabel}s?</span>
      <div class="unit-btns">
        ${[1,2,3,4,5,6,7,8].map(n=>`<button class="unit-btn${unitCounts[sec.id]===n?' active':''}" onclick="unitCounts['${sec.id}']=${n};saveState();render()" style="${unitCounts[sec.id]===n?`border-color:${col.border};background:${col.bg};color:${col.text};`:''}">${n}</button>`).join('')}
      </div>
    </div>`;
  }

  for(let ui=0;ui<numUnits;ui++){
    const unitKey=sec.perUnit?ui:'x';
    if(sec.perUnit) html+=`<div class="unit-heading" style="color:${col.text};border-color:${col.border}">${sec.unitLabel} ${ui+1}</div>`;
    sec.items.forEach((item,i)=>{
      const k=unitKey+'-'+i;
      const ck=!!checked[sec.id][k];
      const note=notes[sec.id][k]||'';
      const itemPhotos=photos[sec.id][k]||[];
      const showNote=showNotes[sec.id][k];
      html+=`<div class="item${ck?' checked':''}" id="item-${ui}-${i}">
        <div class="item-main">
          <div class="check${ck?' checked':''}" onclick="toggleCheck('${sec.id}','${unitKey}',${i})">${checkSVG()}</div>
          <div class="item-text">${item}</div>
          <div class="item-actions">
            <div class="action-btn${note?' has-content':''}" onclick="toggleNote('${sec.id}','${unitKey}',${i})" title="Add note">
              <svg viewBox="0 0 15 15"><path d="M3 2h9a1 1 0 011 1v9l-3 3H3a1 1 0 01-1-1V3a1 1 0 011-1z"/><line x1="4.5" y1="5" x2="10.5" y2="5"/><line x1="4.5" y1="7.5" x2="10.5" y2="7.5"/><line x1="4.5" y1="10" x2="8" y2="10"/></svg>
            </div>
            <div class="action-btn${itemPhotos.length?' has-photo':''}" onclick="triggerPhoto('${sec.id}','${unitKey}',${i})" title="Take photo">
              <svg viewBox="0 0 15 15"><path d="M1 4.5A1.5 1.5 0 012.5 3h.879L4.5 1.5h6l1.121 1.5H12.5A1.5 1.5 0 0114 4.5v7A1.5 1.5 0 0112.5 13h-10A1.5 1.5 0 011 11.5v-7z"/><circle cx="7.5" cy="8" r="2.5"/></svg>
              ${itemPhotos.length?`<span style="position:absolute;top:-4px;right:-4px;background:var(--success);color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700">${itemPhotos.length}</span>`:''}
            </div>
          </div>
        </div>
        ${showNote?`<div class="note-area"><input type="text" placeholder="Add a note..." value="${(note).replace(/"/g,'&quot;')}" oninput="notes['${sec.id}']['${unitKey}-${i}']=this.value;saveState()"></div>`:''}
        ${itemPhotos.length?`<div class="photo-strip">${itemPhotos.map(p=>`<img class="photo-thumb" src="${p}">`).join('')}</div>`:''}
      </div>`;
    });
  }

  // Nav
  const prog2=totalProg();
  html+=`<div class="nav-btns">
    ${activeSection>0?`<button class="nav-btn" onclick="activeSection--;saveState();render()">← ${SECTIONS[activeSection-1].label}</button>`:''}
    ${activeSection<SECTIONS.length-1?`<button class="nav-btn primary" onclick="activeSection++;saveState();showToast('Section saved ✓');render()" style="border-color:${col.border};background:${col.bg};color:${col.text}">${SECTIONS[activeSection+1].label} →</button>`:''}
    ${activeSection===SECTIONS.length-1?`<button class="nav-btn go-live" style="background:var(--cu-gold);border-color:var(--cu-gold)" onclick="showReport()">${prog2.pct===100?'✓ View report & go live':'View report'}</button>`:''}
  </div>`;

  document.getElementById('sectionContent').innerHTML=html;
}

function toggleCheck(sid,unitKey,i){
  const k=unitKey+'-'+i;
  checked[sid][k]=!checked[sid][k];
  saveState();
  render();
}

function toggleNote(sid,unitKey,i){
  const k=unitKey+'-'+i;
  showNotes[sid][k]=!showNotes[sid][k];
  render();
}

function triggerPhoto(sid,unitKey,i){
  pendingPhoto={sid,unitKey,i};
  const fi=document.getElementById('fileInput');
  fi.onchange=handlePhoto;
  fi.click();
}

function handlePhoto(e){
  const file=e.target.files?.[0];
  if(!file||!pendingPhoto)return;
  e.target.value='';
  const{sid,unitKey,i}=pendingPhoto;
  const k=unitKey+'-'+i;
  const reader=new FileReader();
  reader.onload=ev=>{
    if(!photos[sid][k])photos[sid][k]=[];
    photos[sid][k].push(ev.target.result);
    saveState();
    render();
  };
  reader.readAsDataURL(file);
}

function buildReportPayload(){
  const prog=totalProg();
  const now=new Date();
  const dateStr=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  const sections=SECTIONS.map(sec=>{
    const numUnits=sec.perUnit?unitCounts[sec.id]:1;
    const units=[];
    for(let ui=0;ui<numUnits;ui++){
      const unitKey=sec.perUnit?ui:'x';
      const items=sec.items.map((item,i)=>{
        const k=unitKey+'-'+i;
        return {
          item,
          checked:!!checked[sec.id][k],
          note:notes[sec.id][k]||'',
          photos:photos[sec.id][k]||[]
        };
      });
      units.push({unitLabel:sec.perUnit?(sec.unitLabel+' '+(ui+1)):'',items});
    }
    return {label:sec.label,icon:sec.icon,units};
  });

  return {
    operatorEmail,
    propName,
    inspector,
    dateStr,
    progDone:prog.done,
    progTotal:prog.total,
    progPct:prog.pct,
    sections
  };
}

function mailtoFallback(reason){
  const prog=totalProg();
  const now=new Date();
  const dateStr=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  let summary='PRE-LAUNCH INSPECTION REPORT\n';
  summary+='========================\n';
  summary+=propName+' — '+dateStr+'\n';
  summary+='Inspector: '+inspector+'\n';
  summary+='Progress: '+prog.done+'/'+prog.total+' items ('+prog.pct+'%)\n\n';

  SECTIONS.forEach(sec=>{
    const numUnits=sec.perUnit?unitCounts[sec.id]:1;
    summary+=sec.icon+' '+sec.label.toUpperCase()+'\n';
    for(let ui=0;ui<numUnits;ui++){
      const unitKey=sec.perUnit?ui:'x';
      if(sec.perUnit)summary+='  '+sec.unitLabel+' '+(ui+1)+':\n';
      sec.items.forEach((item,i)=>{
        const k=unitKey+'-'+i;
        const ck=!!checked[sec.id][k];
        const note=notes[sec.id][k]||'';
        summary+='  '+(ck?'✓':'✗')+' '+item+(note?' [Note: '+note+']':'')+' \n';
      });
    }
    summary+='\n';
  });

  summary+='\n— Submitted via Coliving Unlocked Pre-Launch Tool';

  const to=operatorEmail||prompt('Send report to (operator email):','');
  if(!to){showToast('No email — report not sent','#BA7517');return;}

  const subject=encodeURIComponent('[Walkthrough Report] '+propName+' — '+dateStr);
  const body=encodeURIComponent(
    (reason?'':'')+
    'Hi,\n\nAttached is the pre-launch inspection report for '+propName+'.\n\n'+
    'Please find the full checklist below. Save the PDF from the report screen and attach it to this email.\n\n'+
    summary
  );

  window.location.href='mailto:'+to+'?subject='+subject+'&body='+body;
  showToast(reason||'Opening email app...','#1D9E75');
}

function submitReport(){
  const to=operatorEmail;
  if(!to){
    // No operator email in the link at all — nothing to send to automatically.
    mailtoFallback('No operator email in link — using your email app instead');
    return;
  }

  if(!REPORT_ENDPOINT||REPORT_ENDPOINT.indexOf('PASTE_YOUR')===0){
    // Backend not configured yet — fall back to mailto so the tool still works.
    mailtoFallback();
    return;
  }

  showToast('Submitting report…','#378ADD');
  const payload=buildReportPayload();

  fetch(REPORT_ENDPOINT,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
    body:JSON.stringify(payload)
  })
  .then(r=>r.json())
  .then(res=>{
    if(res&&res.ok){
      showToast('✓ Report sent to operator','#1D9E75');
    } else {
      mailtoFallback('Could not auto-submit — using your email app instead');
    }
  })
  .catch(()=>{
    mailtoFallback('Could not auto-submit — using your email app instead');
  });
}
</script>
